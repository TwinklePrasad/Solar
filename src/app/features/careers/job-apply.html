<section class="page-hero">
  <div class="container">
    <app-section-heading
      eyebrow="Careers"
      [title]="'Apply: ' + pageTitle()"
      subtitle="Upload your resume and tell us about your experience."
    />
  </div>
</section>

<section class="section">
  <div class="container form-wrap">
    <p class="back-link"><a routerLink="/careers">← Back to open roles</a></p>

    @if (success()) {
      <div class="alert alert--success" role="status">
        Application received. Thank you — we will review your resume and follow up if there is a
        match.
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert--error" role="alert">{{ errorMessage() }}</div>
    }

    <form class="form-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-grid">
        <label>
          <span>Full name</span>
          <input type="text" formControlName="name" autocomplete="name" />
          @if (hasError('name', 'required') || hasError('name', 'minlength')) {
            <small class="field-error">Please enter your name.</small>
          }
        </label>

        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" />
          @if (hasError('email', 'required') || hasError('email', 'email')) {
            <small class="field-error">Enter a valid email address.</small>
          }
        </label>

        <label>
          <span>Phone</span>
          <input type="tel" formControlName="phone" autocomplete="tel" />
          @if (hasError('phone', 'required') || hasError('phone', 'minlength')) {
            <small class="field-error">Enter a valid phone number.</small>
          }
        </label>

        <label>
          <span>Role applying for</span>
          <select formControlName="role">
            @for (role of roleOptions; track role) {
              <option [value]="role">{{ role }}</option>
            }
          </select>
        </label>

        <label>
          <span>Years of experience</span>
          <input type="number" formControlName="years_experience" min="0" max="50" />
          @if (hasError('years_experience', 'required') || hasError('years_experience', 'min')) {
            <small class="field-error">Enter years of experience.</small>
          }
        </label>

        <label class="full">
          <span>Resume / CV (PDF or DOC, max 5 MB)</span>
          <input
            type="file"
            accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            (change)="onFileSelected($event)"
          />
          @if (resumeName()) {
            <small class="file-name">Selected: {{ resumeName() }}</small>
          }
          @if (hasError('resume', 'required')) {
            <small class="field-error">Please upload your resume.</small>
          }
          @if (hasError('resume', 'fileType')) {
            <small class="field-error">Use a PDF or Word document.</small>
          }
          @if (hasError('resume', 'fileSize')) {
            <small class="field-error">File must be 5 MB or smaller.</small>
          }
        </label>

        <label class="full">
          <span>Cover letter / message (optional)</span>
          <textarea formControlName="message" rows="4"></textarea>
        </label>
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Submitting…' : 'Submit application' }}
      </button>
    </form>
  </div>
</section>
