<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="OM SAI SOLAR — clean sun logo">
  <defs>
    <linearGradient id="sunGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>
  <!-- small rounded square background removed for a cleaner look -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- central sun -->
    <circle cx="24" cy="20" r="9" fill="url(#sunGrad)" stroke="#e66f00" stroke-width="1" />
    <!-- four simple rays -->
    <g stroke="#e66f00" stroke-width="1.6">
      <line x1="24" y1="4" x2="24" y2="12" />
      <line x1="24" y1="28" x2="24" y2="36" />
      <line x1="6" y1="20" x2="14" y2="20" />
      <line x1="34" y1="20" x2="42" y2="20" />
    </g>
  </g>
</svg>
