<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="OM SAI SOLAR logo">
  <defs>
    <linearGradient id="sunGradMain" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,8)">
    <!-- clean sun symbol (same style as logo-clean) -->
    <circle cx="24" cy="24" r="12" fill="url(#sunGradMain)" stroke="#e66f00" stroke-width="1.4" />
    <g stroke="#e66f00" stroke-width="1.6" stroke-linecap="round">
      <line x1="24" y1="4" x2="24" y2="12" />
      <line x1="24" y1="36" x2="24" y2="44" />
      <line x1="4" y1="24" x2="12" y2="24" />
      <line x1="36" y1="24" x2="44" y2="24" />
    </g>

    <!-- wordmark -->
    <text x="64" y="24" font-family="Inter, Roboto, Arial, sans-serif" font-weight="800" font-size="20" fill="#111">OM SAI</text>
    <text x="64" y="48" font-family="Inter, Roboto, Arial, sans-serif" font-weight="600" font-size="16" fill="#666">SOLAR</text>
  </g>
</svg>
